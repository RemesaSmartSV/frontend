name: Frontend CI

on:
    push:
        branches: [ develop, main ]
    pull_request:
        branches: [ develop, main ]

jobs:
    build-and-test:
        name: Build and Run Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build project
              run: npm run build

            - name: Run Vitest
              run: npm test
              