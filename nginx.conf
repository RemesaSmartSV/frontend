server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de la API: el navegador llama a /api en el mismo origen,
    # y Nginx lo reenvia al servicio backend_api de docker-compose.
    location /api/ {
        proxy_pass http://backend_api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback SPA: cualquier ruta no encontrada devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
