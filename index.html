<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>RemesaSmartSV</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" defer></script>
    <script>
      // Anti-parpadeo: aplica el tema antes del primer render de React.
      (function() {
        try {
          var u = JSON.parse(localStorage.getItem('usuario') || 'null');
          var t = (u && u.temaPreferido) || localStorage.getItem('tema') || 'claro';
          if (t === 'oscuro' || (t === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
